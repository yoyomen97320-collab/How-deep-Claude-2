name: Build How Deep APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/howdeep/game
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='HowDeep'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.howdeep.game'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.howdeep.game'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#08080C</item>
              <item name="android:navigationBarColor">#08080C</item>
              <item name="android:colorAccent">#B784FF</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#B784FF" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
            <path android:fillColor="#12091B" android:pathData="M30,33L78,33L78,69L62,69L54,80L46,69L30,69Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M39,44L69,44L69,48L39,48ZM39,55L62,55L62,59L39,59Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="How Deep?" android:icon="@drawable/ic_launcher">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/howdeep/game/MainActivity.java <<'JAVA'
          package com.howdeep.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  w.setStatusBarColor(android.graphics.Color.rgb(8,8,12));
                  w.setNavigationBarColor(android.graphics.Color.rgb(8,8,12));
                  webView = new WebView(this);
                  webView.setBackgroundColor(android.graphics.Color.rgb(8,8,12));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setBuiltInZoomControls(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
          }
          JAVA

          cat > app/src/main/assets/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>How Deep?</title>
          <style>
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body {
              margin: 0; padding: 0; height: 100%;
              background: #08080c; color: #f2f0f6;
              font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
              overflow: hidden;
            }
            #app {
              height: 100%;
              display: flex; flex-direction: column;
              padding: env(safe-area-inset-top, 18px) 16px 18px;
            }
            .header { text-align: center; padding-top: 6px; }
            .kicker { font-size: 11px; letter-spacing: 1.5px; color: #a893e8; text-transform: uppercase; }
            .title { font-size: 24px; font-weight: 600; margin-top: 2px; }
            .subtitle { font-size: 12px; color: #9a97a3; margin-top: 2px; }
            .chips {
              display: flex; gap: 8px; overflow-x: auto;
              padding: 16px 0 12px; scrollbar-width: none;
            }
            .chips::-webkit-scrollbar { display: none; }
            .chip {
              flex: 0 0 auto; padding: 8px 16px; border-radius: 999px;
              font-size: 13px; border: 1px solid #2a2a35; background: transparent;
              color: #9a97a3; white-space: nowrap;
            }
            .chip.active { border-color: #b784ff; background: rgba(183,132,255,0.15); color: #cba8ff; }
            .card {
              flex: 1; background: #181820; border-radius: 18px;
              padding: 26px 22px; display: flex; flex-direction: column;
              justify-content: center; position: relative; min-height: 0;
            }
            #qwrap { transition: opacity .2s ease, transform .2s ease; }
            .qcat { font-size: 12px; font-weight: 600; color: #b784ff; letter-spacing: .5px; margin-bottom: 10px; }
            .qtext { font-size: 21px; font-weight: 500; line-height: 1.45; }
            .qcount { position: absolute; bottom: 18px; left: 22px; font-size: 11px; color: #7d7a86; }
            .actions { display: flex; gap: 10px; margin-top: 14px; }
            .btn {
              flex: 1; border: none; border-radius: 12px; padding: 15px 0;
              font-size: 14px; color: #f2f0f6; background: #1c1c26;
              display: flex; align-items: center; justify-content: center; gap: 6px;
            }
            .btn:active { transform: scale(0.97); }
            .btn.primary { background: #b784ff; color: #1a0f2e; font-weight: 600; }
            .btn svg { width: 18px; height: 18px; }
            .histToggle {
              background: none; border: none; color: #9a97a3; font-size: 12px;
              padding: 14px 0 0; width: 100%; display: flex; align-items: center;
              justify-content: center; gap: 6px;
            }
            #histPanel {
              display: none; margin-top: 8px; border-top: 1px solid #22222b;
              padding-top: 10px; max-height: 30vh; overflow-y: auto;
            }
            .histItem { font-size: 12px; color: #c9c6d1; padding: 8px 0; border-bottom: 1px solid #1c1c24; }
            .histEmpty { font-size: 12px; color: #7d7a86; text-align: center; padding: 10px 0; }
          </style>
          </head>
          <body>
          <div id="app">
            <div class="header">
              <div class="kicker">deep questions</div>
              <div class="title">How deep?</div>
              <div class="subtitle">Une question. Une réponse. Une conversation.</div>
            </div>
            <div class="chips" id="chips"></div>
            <div class="card">
              <div id="qwrap">
                <div class="qcat" id="qcat"></div>
                <div class="qtext" id="qtext"></div>
              </div>
              <div class="qcount" id="qcount"></div>
            </div>
            <div class="actions">
              <button class="btn" id="btnPrev" aria-label="Précédent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button class="btn" id="btnRnd" aria-label="Aléatoire">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l5 5"/></svg>
              </button>
              <button class="btn primary" id="btnNext" aria-label="Suivante">
                Suivante
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
            <button class="histToggle" id="btnHist">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              <span id="histLabel">Historique</span>
            </button>
            <div id="histPanel"></div>
          </div>
          <script>
          const DATA = {
            "Ice breakers": [
              "Quel est le premier souvenir que tu as de moi ?",
              "Quel endroit dois-tu absolument visiter avant de mourir ?",
              "De quelles insécurités t'es-tu débarrassé avec le temps ?",
              "Quel artiste écoutes-tu quand tu ne vas pas bien ?",
              "Qu'est-ce qui te motive dans la vie ?",
              "À quoi penses-tu en ce moment ?",
              "Qu'as-tu fait par pure gentillesse sans le dire à personne ?",
              "Selon toi, quelle est la première chose que les gens remarquent chez toi ?",
              "Quelle est une petite insécurité que tu as ?",
              "Quand as-tu fait un compliment à quelqu'un pour la dernière fois ?",
              "Qui aimes-tu le plus dans la vie, et pourquoi ?",
              "Qu'est-ce que la vie t'a appris récemment ?",
              "Quelle chose toute simple te fait sourire ?",
              "Quel est ton compliment préféré qu'on t'ait fait ?",
              "Quel a été le meilleur moment de ta journée ?",
              "Que t'avaient prévenu tes parents et qui s'est révélé vrai ?",
              "Quelle chanson écoutes-tu seul, mais jamais devant les autres ?",
              "Sur une échelle de 1 à 10, quelle note te donnerais-tu en tant que personne, et pourquoi ?",
              "Quand as-tu été vraiment excité pour la dernière fois ? À propos de quoi ?",
              "Quand te sens-tu le plus en paix ?",
              "Si tu devais te faire un compliment, que dirais-tu ?",
              "Qui est une personne qui te remonte le moral ? Comment ?",
              "Quel est ton trait de caractère préféré chez toi ?",
              "Honnêtement, quelle note te donnerais-tu sur 10 ? Pourquoi ?",
              "Quelle est une de tes insécurités ?",
              "Quelle grande chose aimerais-tu changer chez toi ?",
              "Qui aimes-tu le plus dans la vie ?"
            ],
            "Confessions": [
              "Qu'as-tu fait dont tu n'es pas fier ?",
              "Qu'est-ce qui te semble normal mais que les autres trouvent bizarre ?",
              "Quelle est l'expérience la plus humiliante que tu aies vécue ?",
              "Que penserait ton toi du passé en te voyant aujourd'hui ?",
              "Si tu pouvais ramener quelqu'un, qui serait-ce ? Pourquoi cette personne ?",
              "Que penses-tu mériter ?",
              "Quelles excuses te freinent dans la vie ?",
              "Pourquoi as-tu continué à avancer ?",
              "À quoi es-tu accro en ce moment ?",
              "Quelle est ta plus grande insécurité ?",
              "Quel souvenir ne veux-tu jamais oublier ?",
              "Comment vas-tu vraiment ? Sois plus honnête que d'habitude.",
              "Pour quoi serais-tu jugé si les gens le savaient ?",
              "Quand as-tu ressenti le plus de honte pour quelqu'un d'autre ?",
              "Quelle opportunité es-tu content d'avoir saisie ?",
              "Quel a été le moment le plus heureux de ta vie ?",
              "Quand ton ego t'a-t-il empêché pour la dernière fois d'avancer ?",
              "Qu'as-tu trop honte d'admettre en ce moment ?",
              "Quand as-tu dit \"je t'aime\" pour la dernière fois en le pensant vraiment ?",
              "Quel est un souvenir fondateur pour toi ?",
              "Qu'as-tu peur de lâcher prise ?",
              "Qu'as-tu fait dont tu es fier ?",
              "Quel est ton souvenir le plus gênant ?",
              "Quelle phrase qu'on t'a dite n'oublieras-tu jamais ?",
              "En quelle théorie du complot crois-tu ?",
              "Quand as-tu pleuré pour la dernière fois, et pourquoi ?",
              "Qu'est-ce qui compte pour toi mais pas pour les autres ?",
              "Quelle est ta plus grande difficulté en ce moment ?"
            ],
            "Getting deep": [
              "Quel rêve as-tu abandonné et qui te fait encore mal ?",
              "Pour quoi as-tu une vraie passion sans le dire à personne ?",
              "Quels sont les démons les plus difficiles que tu combats ?",
              "Que te dois-tu à toi-même ?",
              "Décris ton moment préféré de ta vie. Que ressens-tu en y repensant maintenant ?",
              "Qu'as-tu peur de transmettre à tes enfants ?",
              "Y a-t-il quelque chose que tu dois lâcher et que tu retiens encore ?",
              "Qu'aimerais-tu que les gens sachent de toi ?",
              "Quel inconnu te restera toujours en mémoire ?",
              "Quelle chance aurais-tu aimé saisir ?",
              "Décris ta pire rupture. Qu'est-ce qu'elle t'a appris ?",
              "Que changerais-tu dans la société ?",
              "Retiens-tu encore quelque chose que tu devrais lâcher ?",
              "Décris un souvenir qui ressemble à une scène de film.",
              "Que fais-tu dont tu n'es pas fier ?",
              "Quel adieu aimerais-tu pouvoir revivre autrement ?"
            ],
            "Wild cards": [
              "Quel pari récent as-tu pris qui a bien fonctionné ?",
              "Pense à un souvenir où le temps semblait suspendu. Décris les petits détails.",
              "Décris un moment qui t'a fait croire en l'amour.",
              "Quelle phrase te fait toujours du bien à entendre ?",
              "Qu'est-ce qui te rend heureux intérieurement et que toi seul sais ?",
              "Si tu pouvais rappeler une seule chose à tout le monde ici, laquelle serait-ce ?",
              "Appelle quelqu'un et dis-lui que tu l'aimes.",
              "Montre ta photo préférée et explique ce qu'elle représente pour toi.",
              "Qu'est-ce qui te vient à l'esprit quand tu entends le mot \"paisible\" ?"
            ]
          };

          const ALL_CATS = ["Toutes", ...Object.keys(DATA)];
          let selected = "Toutes";
          let pool = [];
          let index = 0;
          let history = [];

          const chipsEl = document.getElementById('chips');
          const qcat = document.getElementById('qcat');
          const qtext = document.getElementById('qtext');
          const qcount = document.getElementById('qcount');
          const qwrap = document.getElementById('qwrap');
          const histPanel = document.getElementById('histPanel');
          const histLabel = document.getElementById('histLabel');

          function poolFor(cat) {
            if (cat === "Toutes") {
              let all = [];
              for (const c in DATA) for (const q of DATA[c]) all.push({ cat: c, text: q });
              return all;
            }
            return DATA[cat].map(q => ({ cat, text: q }));
          }

          function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
          }

          function renderChips() {
            chipsEl.innerHTML = '';
            ALL_CATS.forEach(c => {
              const b = document.createElement('button');
              b.className = 'chip' + (c === selected ? ' active' : '');
              b.textContent = c;
              b.onclick = () => selectCat(c);
              chipsEl.appendChild(b);
            });
          }

          function selectCat(c) {
            selected = c;
            pool = shuffle(poolFor(c));
            index = 0;
            renderChips();
            showQ(true);
          }

          function showQ(instant) {
            const q = pool[index];
            const apply = () => {
              qcat.textContent = q.cat.toUpperCase();
              qtext.textContent = q.text;
              qcount.textContent = 'Question ' + (index + 1) + ' / ' + pool.length;
              qwrap.style.opacity = '1';
              qwrap.style.transform = 'translateY(0)';
            };
            if (instant) {
              apply();
            } else {
              qwrap.style.opacity = '0';
              qwrap.style.transform = 'translateY(8px)';
              setTimeout(apply, 180);
            }
            history = history.filter(h => h.text !== q.text);
            history.unshift(q);
            if (history.length > 20) history.pop();
            if (histPanel.style.display === 'block') renderHist();
          }

          function renderHist() {
            if (history.length === 0) {
              histPanel.innerHTML = '<div class="histEmpty">Aucune question vue.</div>';
              return;
            }
            histPanel.innerHTML = history.map(h =>
              '<div class="histItem"><b style="color:#8f7ab8">' + h.cat + '</b><br>' + h.text + '</div>'
            ).join('');
          }

          document.getElementById('btnPrev').onclick = () => {
            index = (index - 1 + pool.length) % pool.length;
            showQ(false);
          };
          document.getElementById('btnNext').onclick = () => {
            index = (index + 1) % pool.length;
            showQ(false);
          };
          document.getElementById('btnRnd').onclick = () => {
            if (pool.length <= 1) return;
            let n;
            do { n = Math.floor(Math.random() * pool.length); } while (n === index);
            index = n;
            showQ(false);
          };
          document.getElementById('btnHist').onclick = () => {
            const open = histPanel.style.display === 'block';
            histPanel.style.display = open ? 'none' : 'block';
            histLabel.textContent = open ? 'Historique' : 'Masquer';
            if 
